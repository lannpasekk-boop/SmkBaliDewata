<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran - SMK Bali Dewata</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="image/logo badewa copy.jpg">
    <style>
        #pendaftaran-page {
    text-align: center;
}

.form-daftar {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 24px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
}

.input-group label {
    margin-bottom: 8px;
    font-weight: 600;
}

.input-group input,
.input-group textarea,
.input-group select {
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus {
    border-color: #0077ff;
    box-shadow: 0 0 8px rgba(0,119,255,0.2);
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.btn-kirim {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #0077ff;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-kirim:hover {
    background: #005fd1;
    transform: translateY(-2px);
}
@media (max-width: 768px){

    nav ul{
        flex-direction: column;
        width: 100%;
    }

    .header-left{
        flex-direction: column;
        text-align: center;
    }

    .program-jurusan{
        flex-direction: column;
    }

    .program-img img{
        width: 100%;
    }

    .fasilitas-grid{
        grid-template-columns: 1fr;
    }

    .kontak-wrapper{
        flex-direction: column;
    }

    .form-daftar{
        padding: 20px;
    }

    .hero-overlay h1{
        font-size: 28px;
    }

    .hero-overlay p{
        font-size: 15px;
    }
}
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="image/logo badewa copy.jpg">
        <div>
            <h1>SMK Bali Dewata</h1>
            <p>Membangun Generasi Cerdas</p>
        </div>
    </div>
</header>

<section id="pendaftaran-page" class="container">
    <h1>Form Pendaftaran</h1>
    <p>Silakan isi data berikut untuk mendaftar</p>

    <form class="form-daftar">
        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Masukkan email" required>
        </div>

        <div class="input-group">
            <label>No WhatsApp</label>
            <input type="tel" placeholder="Masukkan nomor WhatsApp" required>
        </div>

        <div class="input-group">
            <label>Alamat</label>
            <textarea placeholder="Masukkan alamat lengkap"></textarea>
        </div>

        <div class="input-group">
            <label>Pilih Jurusan</label>
            <select required>
                <option value="">-- Pilih Jurusan --</option>
                <option>Akomodasi Perhotelan</option>
                <option>Kuliner</option>
                <option>DKV</option>
                <option>TKJ</option>
                <option>Akuntansi dan Keuangan Lembaga</option>
                <option>PPLG</option>
                <option>Kecantikan dan SPA</option>
            </select>
        </div>

        <button type="submit" class="btn-kirim">
            Kirim Pendaftaran
        </button>
    </form>
</section>

</body>
</html>
